<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Aujourd'hui — Bisave</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="shell">

  <!-- ===== BARRE LATERALE ===== -->
  <aside class="sidebar">
    <div class="sidebar__brand">
      <span class="sidebar__mark">BV</span>
      <span class="sidebar__name">Bisave</span>
    </div>

    <nav class="sidebar__nav">
      <a href="index.html" class="nav-item is-active">
        <svg width="16" height="16" viewBox="0 0 16 16" fill="none"><path d="M2 9L8 3L14 9M4 7.5V13.5H12V7.5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
        Aujourd'hui
      </a>
      <a href="nouvelle-commande.html" class="nav-item">
        <svg width="16" height="16" viewBox="0 0 16 16" fill="none"><path d="M8 2V14M2 8H14" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
        Nouvelle commande
      </a>
      <span class="nav-item is-soon">
        <svg width="16" height="16" viewBox="0 0 16 16" fill="none"><circle cx="8" cy="5" r="2.4" stroke="currentColor" stroke-width="1.5"/><path d="M3 14C3 11 5.2 9.5 8 9.5C10.8 9.5 13 11 13 14" stroke="currentColor" stroke-width="1.5"/></svg>
        Clients
        <span class="nav-item__tag">Bientôt</span>
      </span>
      <span class="nav-item is-soon">
        <svg width="16" height="16" viewBox="0 0 16 16" fill="none"><rect x="2.5" y="3" width="11" height="10" rx="1.5" stroke="currentColor" stroke-width="1.5"/><path d="M2.5 6.5H13.5" stroke="currentColor" stroke-width="1.5"/></svg>
        Statistiques
        <span class="nav-item__tag">Bientôt</span>
      </span>
    </nav>

    <div class="sidebar__footer">
      <div class="sidebar__user">
        <span class="sidebar__avatar">—</span>
        <div>
          <div class="sidebar__user-name">Mon commerce</div>
          <div class="sidebar__user-role">Compte non configuré</div>
        </div>
      </div>
    </div>
  </aside>

  <!-- ===== CONTENU ===== -->
  <div class="content">
    <div class="content__topbar">
      <h1>Aujourd'hui</h1>
      <div class="topbar__actions">
        <a href="nouvelle-commande.html" class="btn btn--primary">+ Nouvelle commande</a>
      </div>
    </div>

    <div class="content__body">

      <div class="kpis">
        <div class="kpi kpi--urgent">
          <div class="kpi__label">Actions urgentes</div>
          <div class="kpi__value" id="kpi-urgent">0</div>
        </div>
        <div class="kpi">
          <div class="kpi__label">À faire aujourd'hui</div>
          <div class="kpi__value" id="kpi-today">0</div>
        </div>
        <div class="kpi">
          <div class="kpi__label">Montant à suivre</div>
          <div class="kpi__value" id="kpi-amount">0 FCFA</div>
        </div>
      </div>

      <div id="groups"></div>

      <div class="empty" id="empty-state" hidden>
        <p class="empty__title">Tout est à jour</p>
        <p class="empty__sub">Aucune action en attente pour l'instant.</p>
      </div>

    </div>
  </div>

</div>

<div class="toast" id="toast" hidden>
  <span class="toast__mark">✓</span>
  <span id="toast-text">Commande enregistrée</span>
</div>

<script src="app.js"></script>
<script>renderDashboard();</script>
</body>
</html>
